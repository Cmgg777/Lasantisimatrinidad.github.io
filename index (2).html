<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pijamada OS</title>
<style>
:root{--bg:#06080c;--ac:#2f7bff;--tx:#eef2f8;--mu:#8793a8;--g:.06;--bl:14px}
*{box-sizing:border-box;margin:0}html,body{min-height:100%}
body{background:radial-gradient(800px 500px at 85% -10%,#12287055,transparent),radial-gradient(600px 400px at 0 100%,#0e1c4a44,transparent),var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif;overflow-x:hidden}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none}
.app{position:relative;z-index:1;display:flex;min-height:100vh}
nav{position:sticky;top:0;height:100vh;width:224px;flex:none;padding:16px 10px;display:flex;flex-direction:column;gap:3px;border-right:1px solid #ffffff14;background:#080b11cc;backdrop-filter:blur(var(--bl))}
.logo{font-weight:800;letter-spacing:.08em;color:var(--ac);padding:4px 10px 14px;font-size:15px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:12px;color:var(--mu);transition:.2s;white-space:nowrap}
nav button:hover{background:#ffffff0d;color:var(--tx)}
nav button.on{background:#2f7bff22;color:#fff;box-shadow:inset 0 0 0 1px #2f7bff77,0 0 18px #2f7bff33}
main{flex:1;min-width:0;padding:28px clamp(14px,4vw,44px) 40px;max-width:1100px;margin:auto}
.hd{margin-bottom:18px}.hd h2{font-size:26px}.mu{color:var(--mu)}
.c{background:rgba(255,255,255,var(--g));border:1px solid #ffffff1c;border-radius:18px;backdrop-filter:blur(var(--bl));-webkit-backdrop-filter:blur(var(--bl));padding:18px;box-shadow:0 10px 30px #0007;transition:.25s;margin-bottom:14px}
.c:hover{border-color:#2f7bff77;box-shadow:0 10px 30px #0007,0 0 22px #2f7bff22}
.fresh .c{animation:in .5s both}.fresh .c:nth-child(2){animation-delay:.06s}.fresh .c:nth-child(3){animation-delay:.12s}.fresh .c:nth-child(n+4){animation-delay:.18s}
@keyframes in{from{opacity:0;transform:translateY(12px)}}@keyframes pop{50%{transform:scale(1.08)}}
.hero{text-align:center;padding:30px 10px 10px}
.hero h1{font-size:clamp(30px,6vw,60px);line-height:1.02;letter-spacing:-.02em;font-weight:900;text-shadow:0 0 40px #2f7bff66}
.hero h3{color:var(--ac);letter-spacing:.35em;margin:10px 0;font-weight:700}
.hero q{display:block;color:var(--mu);font-style:italic;margin-bottom:22px}
.badge{display:inline-block;padding:4px 14px;border-radius:99px;background:#2f7bff22;border:1px solid var(--ac);color:#9cc0ff;font-weight:800;letter-spacing:.12em;box-shadow:0 0 18px #2f7bff55;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 30px #2f7bffaa}}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}.cd p{grid-column:1/-1}
.t{background:#00000055;border:1px solid #2f7bff44;border-radius:14px;padding:12px 4px;text-align:center}
.t b{display:block;font-size:clamp(26px,6vw,46px);font-variant-numeric:tabular-nums}.t small{color:var(--mu)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.g3 .c{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select{background:#0008;border:1px solid #ffffff22;color:var(--tx);border-radius:10px;padding:10px 12px;font:inherit;min-width:0;flex:1;transition:.2s}
input:focus,select:focus{outline:none;border-color:var(--ac);box-shadow:0 0 0 3px #2f7bff33}
input[type=checkbox]{flex:none;width:22px;height:22px;accent-color:var(--ac)}input[type=range]{padding:0}
.b{all:unset;cursor:pointer;background:linear-gradient(135deg,#2f7bff,#1b57d6);color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;transition:.2s;text-align:center;min-height:42px;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center}
.b:hover{transform:translateY(-2px);box-shadow:0 6px 18px #2f7bff66}.b:active{transform:scale(.97)}
.b.g{background:#ffffff12;border:1px solid #ffffff22}.b.s{padding:6px 12px;min-height:34px;font-size:13px}
.x{all:unset;cursor:pointer;color:var(--mu);padding:6px 10px;border-radius:8px}.x:hover{color:#ff6b6b;background:#ff6b6b18}
.bar{height:10px;background:#ffffff14;border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,#1b57d6,#6aa2ff);box-shadow:0 0 12px var(--ac);transition:width .6s}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;margin-bottom:8px}
.it label{display:flex;gap:12px;align-items:center;flex:1;cursor:pointer}.it span{transition:.3s}
.done span{text-decoration:line-through;color:var(--mu)}.done{border-color:#2f7bff55}.pop span,.pop{animation:pop .4s}
.av{font-size:54px;width:90px;height:90px;display:grid;place-items:center;margin:0 auto 8px;border-radius:50%;background:#2f7bff1c;border:2px solid var(--ac);box-shadow:0 0 24px #2f7bff55}
.pc{text-align:center}.pc h3{font-size:20px}
.st{display:inline-block;margin:8px 0;padding:3px 12px;border-radius:99px;background:#ffffff10;font-size:13px;font-weight:700}
.tl{position:relative;padding-left:26px;border-left:2px solid #2f7bff55;margin-left:8px}
.ev{position:relative;margin-bottom:12px}.ev:before{content:"";position:absolute;left:-35px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--ac);box-shadow:0 0 12px var(--ac)}
.ev .c{display:flex;gap:12px;align-items:center;margin:0}.ev b{color:#8fb7ff;font-size:18px;font-variant-numeric:tabular-nums}.ev p{flex:1}
.opt{display:flex;align-items:center;gap:10px;margin:8px 0}.opt>span{width:110px;flex:none}.opt .bar{flex:1;margin:0}.opt small{width:46px;text-align:right;color:var(--mu)}
.empty{text-align:center;color:var(--mu);font-size:15px}.empty:first-letter{font-size:30px}
.rk{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:10px}.rk label{font-size:12px;color:var(--mu)}.rk input{width:100%;margin-top:3px;text-align:center}
.tt{color:#ffd76a;font-weight:700;margin-bottom:6px}
.msg b{color:#8fb7ff}.msg small{color:var(--mu);margin-left:8px}.msg p{margin-top:4px;word-break:break-word}
.msg{position:relative}.msg .x{position:absolute;right:10px;top:10px}
label.f{display:block;margin-bottom:10px;color:var(--mu);font-size:13px}label.f input,label.f select{width:100%;margin-top:4px;color:var(--tx)}
#modal{position:fixed;inset:0;z-index:50;background:#000a;backdrop-filter:blur(6px);display:none;place-items:center;padding:16px}
#modal.on{display:grid}#modal .c{width:min(420px,100%);margin:0;background:#0d1219ee;animation:in .25s}
#toasts{position:fixed;right:16px;top:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#0d1219ee;border:1px solid var(--ac);box-shadow:0 0 20px #2f7bff55;padding:10px 16px;border-radius:12px;animation:in .3s}
.na *{animation:none!important;transition:none!important}
.ro .b[data-a]:not([data-a=nav]):not([data-a=mc]):not([data-a=mo]):not([data-a=exp]):not([data-a=lock]),.ro .x,.ro label.b,.ro form[data-f]:not([data-f=unlock]):not([data-f=adminlogin]){display:none!important}
.ro .it label{cursor:default}input:disabled,select:disabled{opacity:.6;cursor:not-allowed}
.mode{margin-top:auto;padding:8px 12px;font-size:12px;color:var(--mu);white-space:nowrap}
.sec img{max-width:100%;border-radius:12px;margin-top:8px}
@media(max-width:760px){
nav{position:fixed;top:auto;bottom:0;left:0;right:0;width:auto;height:auto;flex-direction:row;overflow-x:auto;padding:8px;border-right:0;border-top:1px solid #ffffff1a;z-index:20}
.logo{display:none}.mode{margin:0 0 0 auto}nav button{padding:10px 14px}main{padding-bottom:90px}#toasts{top:auto;bottom:80px;right:12px;left:12px}
.opt>span{width:80px}.ev .c{flex-wrap:wrap}}
</style></head><body>
<canvas id="bg"></canvas>
<div class="app"><nav id="nav"></nav><main id="main"></main></div>
<div id="modal"></div><div id="toasts"></div>
<script>
// ===== CONFIGURA AQUÍ =====
const CLAVE_SECRETA='caos123'; // contraseña de ARCHIVOS CLASIFICADOS
const ADMIN_CLAVE='cambia-esta-clave'; // contraseña de ADMIN: solo quien la tenga puede modificar datos
// ==========================
const $=s=>document.querySelector(s),K=n=>'pijamada_'+n,uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const D={
settings:{name:'LA SANTÍSIMA TRINIDAD DEL CAOS',date:'',time:'',place:'',glass:14,anim:true,reduced:false},
participants:[['César','😎','Cerebro de la operación'],['Sebas','🎮','Jugador estrella'],['Samuel','🗿','Agente del caos']].map((p,i)=>({id:'p'+i,name:p[0],emoji:p[1],role:p[2],status:'p'})),
checklist:['🎮 Consola','🎮 Controles','🔌 Cargadores','🍕 Comida','🥤 Bebidas','🍿 Snacks','🛏️ Almohadas','🧥 Ropa para dormir','🎬 Películas','🔊 Parlante'].map(n=>({id:uid(),n,d:false})),
schedule:[['20:00','Llegada'],['21:00','Comida'],['22:00','Gaming'],['00:00','Película'],['02:00','Torneo'],['04:00','"Intentar dormir"'],['06:00','Crisis existencial']].map(e=>({id:uid(),t:e[0],n:e[1]})),
votes:[['game','🎮 ¿Qué jugamos?',['Minecraft','Fortnite','FC','GTA','Otro']],['watch','🎬 ¿Qué vemos?',['Película','Serie','YouTube','Terror','Comedia']],['food','🍕 ¿Qué comemos? (no confirmado)',['Pizza','Hamburguesas','Completo','Snacks','Otro']]].map(v=>({id:v[0],t:v[1],o:v[2].map(n=>({n,v:0}))})),
messages:['El que se duerma primero pierde.','TRAIGAN CARGADORES.','Nadie toca mi control.','A las 4 AM tomamos decisiones cuestionables.'].map(m=>({id:uid(),a:'Anónimo',m,ts:Date.now()})),
challenges:['Ganar una partida sin morir','Hacer un gol desde fuera del área','Ganarle al amigo más tryhard','Sobrevivir una película de terror','Aguantar despierto hasta las 5 AM','Hacer una foto absurda','Completar un reto secreto'].map(t=>({id:uid(),t,done:false,by:'',pts:0})),
stats:{p:{},cats:{}},
secret:[{id:uid(),t:'📜 Frase interna: edítame con la frase oficial del grupo.'},{id:uid(),t:'🗿 Meme pendiente de clasificar.'},{id:uid(),t:'📸 Pega aquí la URL de una imagen (.jpg/.png/.gif) y se mostrará.'},{id:uid(),t:'🏛️ Evento histórico de la amistad: por redactar.'}]};
const clone=o=>JSON.parse(JSON.stringify(o));
const S={};for(const k in D){try{const v=localStorage.getItem(K(k));S[k]=v?JSON.parse(v):clone(D[k])}catch(e){S[k]=clone(D[k])}}
S.settings={...D.settings,...S.settings};
const saveLocal=()=>{try{for(const k in S)localStorage.setItem(K(k),JSON.stringify(S[k]))}catch(e){}};
const sv=(m)=>{saveLocal();if(m)toast('💾 Cambios guardados');if(admin)schedulePush()};
// ===== Sincronización automática vía GitHub =====
let SY={},pt=null,lastRaw='',syncMsg='';try{SY=JSON.parse(localStorage.getItem('pijamada_sync'))||{}}catch(e){}
const syncOn=()=>!!(SY.u&&SY.r&&SY.t);
function modeTxt(){return(admin?'🛠️ Modo admin':'🔒 Solo lectura')+(admin&&syncOn()&&syncMsg?' · '+syncMsg:'')}
function setStatus(m){syncMsg=m;const e=document.querySelector('.mode');if(e)e.textContent=modeTxt()}
function schedulePush(){if(!syncOn())return;try{localStorage.setItem('pijamada_dirty','1')}catch(e){}clearTimeout(pt);setStatus('⏳ guardando…');pt=setTimeout(push,1500)}
async function push(){try{const url=`https://api.github.com/repos/${SY.u}/${SY.r}/contents/datos.json`,h={Authorization:'Bearer '+SY.t,Accept:'application/vnd.github+json'};
let sha;const g=await fetch(url+'?t='+Date.now(),{headers:h,cache:'no-store'});if(g.ok)sha=(await g.json()).sha;else if(g.status!=404)throw new Error(g.status);
const p=await fetch(url,{method:'PUT',headers:h,body:JSON.stringify({message:'Actualizar datos',content:btoa(unescape(encodeURIComponent(JSON.stringify(S)))),sha})});
if(!p.ok)throw new Error(p.status);localStorage.removeItem('pijamada_dirty');setStatus('☁️ sincronizado');toast('☁️ Publicado: tus amigos lo verán en 1–2 min')}
catch(e){setStatus('⚠️ sin sincronizar');toast('⚠️ No se pudo sincronizar. Revisa usuario, repositorio y token')}}
async function pull(first){try{const r=await fetch('datos.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)return;const raw=await r.text();if(raw===lastRaw)return;lastRaw=raw;
if(admin&&!(first&&!localStorage.getItem('pijamada_dirty')))return;
const o=JSON.parse(raw);for(const k in D)if(k in o)S[k]=o[k];S.settings={...D.settings,...S.settings};saveLocal();if(!document.querySelector('#modal.on'))render()}catch(e){}}
const ST={c:['🟢','CONFIRMADO'],p:['🟡','PENDIENTE'],n:['🔴','NO VIENE']},AV=['😎','🎮','🗿','💀','🧠','👾','🤖','🔥'];
const st=id=>S.stats.p[id]||(S.stats.p[id]={w:0,pt:0,rc:0,el:0,h:0});
const NAV=[['home','🏠 Inicio'],['people','👥 Participantes'],['check','📋 Checklist'],['plan','🎮 Plan'],['votes','🗳️ Votaciones'],['rank','🏆 Ranking'],['wall','💬 Muro del caos'],['chal','🔥 Retos'],['secret','🔐 Clasificado'],['cfg','⚙️ Config']];
let admin=false;try{admin=localStorage.getItem('pijamada_admin')==='1'}catch(e){}
const deny=()=>toast('🔒 Solo el admin puede modificar datos');
const adminCard=()=>admin?`<div class="c"><h3>🛠️ Modo admin activo</h3><p class="mu" style="margin:6px 0 10px">Solo tú puedes modificar datos en este navegador.</p><button class="b g s" data-a="alogout">Cerrar sesión admin</button></div><form class="c" data-f="savesync"><h3 style="margin-bottom:6px">☁️ Sincronización automática</h3><p class="mu" style="margin-bottom:10px">Cada cambio tuyo se publica solo en tu repositorio de GitHub y tus amigos lo ven en 1–2 minutos. El token se guarda solo en este navegador.</p><label class="f">Usuario de GitHub<input name="u" value="${esc(SY.u)}" autocomplete="off"></label><label class="f">Repositorio<input name="r" value="${esc(SY.r)}" autocomplete="off"></label><label class="f">Token (permiso Contents: lectura y escritura)<input type="password" name="t" value="${esc(SY.t)}" autocomplete="off"></label><button class="b">Guardar y sincronizar</button></form>`:`<form class="c row" data-f="adminlogin"><input type="password" name="p" placeholder="Contraseña de admin" required autocomplete="off"><button class="b">🛠️ Entrar como admin</button></form>`;
let cur=(location.hash||'#home').slice(1),unlocked=false,POP='',MOK=null;
if(!NAV.some(n=>n[0]==cur))cur='home';
const pname=id=>(S.participants.find(p=>p.id==id)||{}).name||'—';
const popts=(blank)=>(blank?[['','—']]:[]).concat(S.participants.map(p=>[p.id,p.emoji+' '+p.name]));
const head=(t,s)=>`<header class="hd"><h2>${t}</h2><p class="mu">${s}</p></header>`;
const empty=t=>`<div class="c empty">👻<p>${t}</p></div>`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;$('#toasts').append(t);setTimeout(()=>{t.style.opacity=0;setTimeout(()=>t.remove(),300)},2200)}
function modal(title,fields,ok,lbl){const m=$('#modal');
m.innerHTML=`<div class="c"><h3 style="margin-bottom:12px">${title}</h3>${fields.map(f=>`<label class="f">${f.l}${f.o?`<select name="${f.k}">${f.o.map(o=>`<option value="${esc(o[0])}"${o[0]==f.v?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:`<input name="${f.k}" type="${f.type||'text'}" value="${esc(f.v)}">`}</label>`).join('')}<div class="row" style="justify-content:flex-end"><button class="b g" data-a="mc">Cancelar</button><button class="b" data-a="mo">${lbl||'Guardar'}</button></div></div>`;
m.classList.add('on');MOK=()=>{const r={};m.querySelectorAll('[name]').forEach(e=>r[e.name]=e.value);m.classList.remove('on');ok(r)};const i=m.querySelector('input');i&&i.focus()}
const sortT=a=>[...a].sort((x,y)=>k(x.t)-k(y.t));const k=t=>{const[h,m]=(t||'0:0').split(':').map(Number);return((h<12?h+24:h)*60)+m};
const V={
home(){const s=S.settings,L=S.checklist,n=L.filter(x=>x.d).length,c=S.participants.filter(p=>p.status=='c').length,ch=S.challenges.filter(x=>x.done).length;
return`<div class="hero"><h1>${esc(s.name)}</h1><h3>PIJAMADA OS</h3><q>"Operación oficialmente autorizada. El sentido común no está incluido."</q></div>
<div class="c" style="text-align:center"><p class="mu">🛌 ESTADO DE LA MISIÓN</p><div style="margin:8px 0"><span class="badge" id="mis">CONFIRMADA</span></div><div class="cd" id="cd"></div>
<div class="g3"><div class="c">📅 <b>${s.date?new Date(s.date+'T12:00').toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'}):'Por definir'}</b></div><div class="c">🕐 <b>${esc(s.time)||'Por definir'}</b></div><div class="c">📍 <b>${esc(s.place)||'Por definir'}</b></div></div>
<button class="b g s" style="margin-top:14px" data-a="nav" data-i="cfg">⚙️ Editar fecha, hora y lugar</button></div>
<div class="g3"><div class="c"><h3>${c}/${S.participants.length}</h3><p class="mu">confirmados</p></div><div class="c"><h3>${n}/${L.length}</h3><p class="mu">cosas listas</p></div><div class="c"><h3>${ch}/${S.challenges.length}</h3><p class="mu">retos completados</p></div></div>`},
people(){return head('👥 Participantes','La tripulación')+`<div class="g3">${S.participants.map(p=>`<div class="c pc"><div class="av">${esc(p.emoji)}</div><h3>${esc(p.name)}</h3><p class="mu">${esc(p.role)}</p><span class="st">${ST[p.status].join(' ')}</span><div class="row" style="justify-content:center"><button class="b s" data-a="stat" data-i="${p.id}">Cambiar estado</button><button class="b g s" data-a="av" data-i="${p.id}">Avatar</button><button class="b g s" data-a="editp" data-i="${p.id}">Editar</button></div></div>`).join('')}</div>`},
check(){const L=S.checklist,n=L.filter(x=>x.d).length,p=L.length?Math.round(n/L.length*100):0;
return head('📋 Checklist','Lo que hay que llevar')+`<div class="c"><b>${n} / ${L.length} completados</b><div class="bar"><i style="width:${p}%"></i></div></div><form class="c row" data-f="addcheck"><input name="v" placeholder="Agregar elemento…" required><button class="b">＋ Agregar</button></form>`+(L.length?L.map(x=>`<div class="c it ${x.d?'done':''} ${x.id==POP?'pop':''}"><label><input type="checkbox" ${x.d?'checked':''} data-c="chk" data-i="${x.id}"><span>${esc(x.n)}</span></label><button class="x" data-a="delchk" data-i="${x.id}">✕</button></div>`).join(''):empty('Lista vacía. Agrega lo que no pueden olvidar.'))},
plan(){return head('🎮 Plan de la noche','Línea de tiempo oficial')+`<button class="b" data-a="addev" style="margin-bottom:16px">＋ Agregar evento</button>`+(S.schedule.length?`<div class="tl">${sortT(S.schedule).map(e=>`<div class="ev"><div class="c"><b>${esc(e.t)}</b><p>${esc(e.n)}</p><button class="x" data-a="edev" data-i="${e.id}">✎</button><button class="x" data-a="delev" data-i="${e.id}">✕</button></div></div>`).join('')}</div>`:empty('Sin plan. Eso ya es un plan, pero agreguemos algo.'))},
votes(){return head('🗳️ Votaciones','La democracia del caos')+S.votes.map(c=>{const t=c.o.reduce((a,o)=>a+o.v,0);return`<div class="c"><div class="row" style="justify-content:space-between"><h3>${c.t}</h3><button class="b g s" data-a="rv" data-i="${c.id}">Reiniciar</button></div><p class="mu">${t} voto${t==1?'':'s'}</p>${c.o.map((o,j)=>`<div class="opt"><span>${esc(o.n)}</span><div class="bar"><i style="width:${t?o.v/t*100:0}%"></i></div><small>${o.v}</small><button class="b s" data-a="vote" data-i="${c.id}" data-o="${j}">Votar</button></div>`).join('')}</div>`}).join('')},
rank(){const P=[...S.participants].sort((a,b)=>st(b.id).pt-st(a.id).pt),T=['🥇 MVP DE LA NOCHE','🥈 SEGUNDO AL MANDO','🥉 SOBREVIVIENTE'],F=[['w','🎮 Victorias'],['pt','🏆 Puntos'],['rc','😂 Retos'],['el','💀 Eliminado'],['h','😴 Horas despierto']];
const C=[['sleep','💀 Primero en dormirse'],['npc','🗿 Más NPC'],['try','🎮 Más tryhard'],['prob','😂 Más probable de causar problemas'],['brain','🧠 Cerebro de la operación']];
return head('🏆 Ranking','Estadísticas oficiales (editables)')+`<div class="g3">${P.map((p,i)=>`<div class="c"><div class="tt">${T[i]||''}</div><h3>${esc(p.emoji)} ${esc(p.name)}</h3><div class="rk">${F.map(f=>`<label>${f[1]}<input type="number" min="0" value="${st(p.id)[f[0]]}" data-c="stat" data-i="${p.id}" data-k="${f[0]}"></label>`).join('')}</div></div>`).join('')}</div><div class="c" style="margin-top:14px"><h3 style="margin-bottom:10px">Títulos absurdos</h3>${C.map(c=>`<label class="f">${c[1]}<select data-c="cat" data-k="${c[0]}">${popts(1).map(o=>`<option value="${o[0]}"${S.stats.cats[c[0]]==o[0]?' selected':''}>${esc(o[1])}</option>`).join('')}</select></label>`).join('')}</div>`},
wall(){const M=[...S.messages].sort((a,b)=>b.ts-a.ts);return head('💬 Muro del caos','Dejen constancia')+`<form class="c row" data-f="addmsg"><select name="a" style="flex:0 0 140px">${popts().map(o=>`<option value="${esc(pname(o[0]))}">${esc(o[1])}</option>`).join('')}<option>Anónimo</option></select><input name="m" placeholder="Escribe algo…" maxlength="280" required><button class="b">Publicar</button></form>`+(M.length?M.map(m=>`<div class="c msg"><b>${esc(m.a)}</b><small>${new Date(m.ts).toLocaleString('es',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})}</small><button class="x" data-a="delmsg" data-i="${m.id}">✕</button><p>${esc(m.m)}</p></div>`).join(''):empty('El muro está en silencio. Sospechoso.'))},
chal(){return head('🔥 Retos de la noche','Completa y suma puntos')+`<button class="b" data-a="addch" style="margin-bottom:14px">＋ Nuevo reto</button>`+(S.challenges.length?S.challenges.map(c=>`<div class="c it ${c.done?'done':''}"><label style="cursor:pointer" data-a="tgl" data-i="${c.id}"><span style="font-size:20px">${c.done?'☑':'☐'}</span><span>${esc(c.t)}${c.done?` <small>· ${esc(pname(c.by))} +${c.pts}</small>`:''}</span></label><button class="x" data-a="delch" data-i="${c.id}">✕</button></div>`).join(''):empty('No hay retos. Qué aburrido.'))},
secret(){if(!unlocked)return head('🔐 ARCHIVOS CLASIFICADOS','Acceso restringido')+`<form class="c row" data-f="unlock"><input type="password" name="p" placeholder="Contraseña" required autocomplete="off"><button class="b">Desbloquear</button></form>`;
return head('🗃️ ARCHIVO CLASIFICADO','Información que probablemente nunca debió almacenarse.')+`<div class="row" style="margin-bottom:14px"><button class="b" data-a="addsec">＋ Agregar</button><button class="b g" data-a="lock">Bloquear</button></div>`+(S.secret.length?S.secret.map(x=>`<div class="c it sec"><div style="flex:1;word-break:break-word">${/^https?:\/\/\S+\.(png|jpe?g|gif|webp)(\?\S*)?$/i.test(x.t.trim())?`<img src="${esc(x.t.trim())}" alt="">`:esc(x.t)}</div><button class="x" data-a="edsec" data-i="${x.id}">✎</button><button class="x" data-a="delsec" data-i="${x.id}">✕</button></div>`).join(''):empty('Archivo vacío.'))},
cfg(){const s=S.settings;return head('⚙️ Configuración','Ajusta Pijamada OS')+adminCard()+`<form class="c" data-f="saveset"><h3 style="margin-bottom:10px">Pijamada</h3><label class="f">Nombre<input name="name" value="${esc(s.name)}"></label><label class="f">Fecha<input type="date" name="date" value="${esc(s.date)}"></label><label class="f">Hora<input type="time" name="time" value="${esc(s.time)}"></label><label class="f">Lugar<input name="place" value="${esc(s.place)}"></label><button class="b">Guardar cambios</button></form>
<div class="c"><h3 style="margin-bottom:10px">Participantes</h3>${S.participants.map(p=>`<div class="row" style="margin-bottom:8px"><span style="flex:1">${esc(p.emoji)} ${esc(p.name)} · ${ST[p.status].join(' ')}</span><button class="b g s" data-a="editp" data-i="${p.id}">Editar</button></div>`).join('')}</div>
<div class="c"><h3 style="margin-bottom:10px">Apariencia</h3><label class="f">Intensidad del glass<input type="range" min="0" max="30" value="${s.glass}" data-c="glass"></label><label class="it" style="padding:0"><span>Animaciones</span><input type="checkbox" ${s.anim?'checked':''} data-c="anim"></label><label class="it" style="padding:0"><span>Modo reducido</span><input type="checkbox" ${s.reduced?'checked':''} data-c="reduced"></label></div>
<div class="c"><h3 style="margin-bottom:10px">Datos</h3><div class="row"><button class="b" data-a="exp">⬇ Exportar</button><label class="b g">⬆ Importar<input type="file" accept=".json,application/json" data-c="imp" hidden></label><button class="b g" style="color:#ff8080" data-a="wipe">🗑 Borrar todo</button></div></div>`}};
function render(fresh){document.body.classList.toggle('ro',!admin);document.body.classList.toggle('na',!S.settings.anim||S.settings.reduced);document.documentElement.style.setProperty('--bl',S.settings.glass+'px');
$('#nav').innerHTML=`<div class="logo">🛌 PIJAMADA OS</div>`+NAV.map(n=>`<button class="${n[0]==cur?'on':''}" data-a="nav" data-i="${n[0]}">${n[1]}</button>`).join('')+`<div class="mode">${modeTxt()}</div>`;
$('#main').innerHTML=`<section class="${fresh?'fresh':''}">${V[cur]()}</section>`;POP='';
if(!admin)$('#main').querySelectorAll('input,select').forEach(e=>{if(!e.closest('form[data-f=unlock],form[data-f=adminlogin]'))e.disabled=true});
tick()}
function tick(){const e=$('#cd');if(!e)return;const s=S.settings;if(!s.date){e.innerHTML='<p class="mu">Define la fecha en ⚙️ Config para activar la cuenta regresiva.</p>';return}
let d=new Date(s.date+'T'+(s.time||'00:00'))-Date.now();if(d<=0){d=0;$('#mis').textContent='¡EN CURSO!'}
e.innerHTML=[['Días',864e5],['Horas',36e5],['Minutos',6e4],['Segundos',1e3]].map(([l,m])=>{const v=Math.floor(d/m);d-=v*m;return`<div class="t"><b>${String(v).padStart(2,'0')}</b><small>${l}</small></div>`}).join('')}
setInterval(tick,1000);
const go=id=>{cur=id;location.hash=id;render(1);scrollTo(0,0)};
const H={nav:go,mc:()=>$('#modal').classList.remove('on'),mo:()=>MOK&&MOK(),
stat(i){const p=S.participants.find(x=>x.id==i);p.status={c:'p',p:'n',n:'c'}[p.status];sv();render();toast('💾 Cambios guardados')},
av(i){const p=S.participants.find(x=>x.id==i);p.emoji=AV[(AV.indexOf(p.emoji)+1)%AV.length];sv();render()},
editp(i){const p=S.participants.find(x=>x.id==i);modal('Editar participante',[{l:'Nombre',k:'n',v:p.name},{l:'Emoji (😎 🎮 🗿 💀 🧠)',k:'e',v:p.emoji},{l:'Rol',k:'r',v:p.role},{l:'Estado',k:'s',v:p.status,o:[['c','🟢 Confirmado'],['p','🟡 Pendiente'],['n','🔴 No viene']]}],r=>{p.name=r.n.trim()||p.name;p.emoji=r.e.trim()||p.emoji;p.role=r.r;p.status=r.s;sv(1);render()})},
delchk(i){S.checklist=S.checklist.filter(x=>x.id!=i);sv();render()},
addev(){modal('Nuevo evento',[{l:'Hora',k:'t',type:'time',v:'20:00'},{l:'Evento',k:'n',v:''}],r=>{if(!r.n.trim())return;S.schedule.push({id:uid(),t:r.t,n:r.n.trim()});sv(1);render()})},
edev(i){const e=S.schedule.find(x=>x.id==i);modal('Editar evento',[{l:'Hora',k:'t',type:'time',v:e.t},{l:'Evento',k:'n',v:e.n}],r=>{e.t=r.t||e.t;e.n=r.n.trim()||e.n;sv(1);render()})},
delev(i){modal('¿Eliminar este evento?',[],()=>{S.schedule=S.schedule.filter(x=>x.id!=i);sv();render()},'Eliminar')},
vote(i,el){S.votes.find(c=>c.id==i).o[el.dataset.o].v++;sv();render();toast('🗳️ Voto registrado')},
rv(i){modal('¿Reiniciar esta votación?',[],()=>{S.votes.find(c=>c.id==i).o.forEach(o=>o.v=0);sv();render();toast('🔄 Votación reiniciada')},'Reiniciar')},
delmsg(i){S.messages=S.messages.filter(x=>x.id!=i);sv();render()},
tgl(i){const c=S.challenges.find(x=>x.id==i);if(c.done){st(c.by).pt-=c.pts;st(c.by).rc=Math.max(0,st(c.by).rc-1);c.done=false;sv();render();return}
modal('¿Quién lo completó?',[{l:'Participante',k:'by',v:S.participants[0].id,o:popts()},{l:'Puntos',k:'pts',type:'number',v:10}],r=>{c.done=true;c.by=r.by;c.pts=Math.max(0,+r.pts||0);st(c.by).pt+=c.pts;st(c.by).rc++;sv();render();toast('🏆 ¡Nuevo reto completado!')},'Completar')},
addch(){modal('Nuevo reto',[{l:'Reto',k:'t',v:''}],r=>{if(!r.t.trim())return;S.challenges.push({id:uid(),t:r.t.trim(),done:false,by:'',pts:0});sv(1);render()})},
delch(i){modal('¿Eliminar este reto?',[],()=>{const c=S.challenges.find(x=>x.id==i);if(c.done){st(c.by).pt-=c.pts;st(c.by).rc=Math.max(0,st(c.by).rc-1)}S.challenges=S.challenges.filter(x=>x.id!=i);sv();render()},'Eliminar')},
lock(){unlocked=false;render()},
addsec(){modal('Nuevo archivo',[{l:'Contenido (texto o URL de imagen)',k:'t',v:''}],r=>{if(!r.t.trim())return;S.secret.push({id:uid(),t:r.t.trim()});sv(1);render()})},
edsec(i){const x=S.secret.find(y=>y.id==i);modal('Editar archivo',[{l:'Contenido',k:'t',v:x.t}],r=>{x.t=r.t.trim()||x.t;sv(1);render()})},
delsec(i){modal('¿Eliminar este archivo?',[],()=>{S.secret=S.secret.filter(x=>x.id!=i);sv();render()},'Eliminar')},
exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='pijamada-os-datos.json';a.click();toast('⬇ Datos exportados')},
wipe(){modal('¿Borrar TODOS los datos? No se puede deshacer.',[],()=>{for(const k in D)S[k]=clone(D[k]);sv();render(1);toast('🗑 Datos borrados')},'Borrar todo')}};
const C={chk(el){const x=S.checklist.find(y=>y.id==el.dataset.i);x.d=el.checked;POP=x.d?x.id:'';sv();render();if(x.d)toast('✅ Tarea completada')},
stat(el){st(el.dataset.i)[el.dataset.k]=Math.max(0,+el.value||0);sv();toast('💾 Cambios guardados')},
cat(el){S.stats.cats[el.dataset.k]=el.value;sv();toast('💾 Cambios guardados')},
glass(el){S.settings.glass=+el.value;sv();document.documentElement.style.setProperty('--bl',el.value+'px')},
anim(el){S.settings.anim=el.checked;sv();render()},reduced(el){S.settings.reduced=el.checked;sv();render()},
imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(typeof o!='object'||!o)throw 0;let n=0;for(const k in D)if(k in o){S[k]=o[k];n++}if(!n)throw 0;S.settings={...D.settings,...S.settings};sv();render(1);toast('⬆ Datos importados')}catch(e){toast('❌ Archivo inválido')}};r.readAsText(f)}};
const F={addcheck(f){const v=f.v.value.trim();if(!v)return;S.checklist.push({id:uid(),n:v,d:false});sv();render();toast('➕ Elemento agregado')},
addmsg(f){S.messages.push({id:uid(),a:f.a.value,m:f.m.value.trim(),ts:Date.now()});sv();render();toast('💬 Mensaje publicado')},
unlock(f){if(f.p.value===CLAVE_SECRETA){unlocked=true;render(1);toast('🔓 Acceso concedido')}else{f.p.value='';toast('⛔ Contraseña incorrecta')}},
saveset(f){Object.assign(S.settings,{name:f.name.value.trim()||D.settings.name,date:f.date.value,time:f.time.value,place:f.place.value.trim()});sv(1);render()}};
F.savesync=f=>{SY={u:f.u.value.trim(),r:f.r.value.trim(),t:f.t.value.trim()};try{localStorage.setItem('pijamada_sync',JSON.stringify(SY))}catch(e){}if(!syncOn()){toast('Completa usuario, repositorio y token');return}toast('☁️ Sincronizando…');push()};
H.alogout=()=>{admin=false;try{localStorage.removeItem('pijamada_admin')}catch(e){}render();toast('🔒 Sesión admin cerrada')};
F.adminlogin=f=>{if(f.p.value===ADMIN_CLAVE){admin=true;try{localStorage.setItem('pijamada_admin','1')}catch(e){}render();toast('🛠️ Modo admin activado')}else{f.p.value='';toast('⛔ Contraseña incorrecta')}};
[[H,['nav','mc','mo','exp','lock','alogout']],[C,[]],[F,['unlock','adminlogin']]].forEach(([o,ok])=>{for(const k in o){if(ok.includes(k))continue;const fn=o[k];o[k]=(...a)=>admin?fn(...a):deny()}});
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(el&&H[el.dataset.a]){H[el.dataset.a](el.dataset.i,el)}});
document.addEventListener('change',e=>{const el=e.target;if(el.dataset.c&&C[el.dataset.c])C[el.dataset.c](el)});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.f){e.preventDefault();F[f.dataset.f](f)}});
document.addEventListener('keydown',e=>{if(e.key=='Enter'&&$('#modal').classList.contains('on')&&e.target.tagName=='INPUT')H.mo();if(e.key=='Escape')H.mc()});
addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!=cur&&NAV.some(n=>n[0]==h)){cur=h;render(1)}});
(()=>{const c=$('#bg'),x=c.getContext('2d');let w,h;const P=[];const rs=()=>{w=c.width=innerWidth;h=c.height=innerHeight};rs();addEventListener('resize',rs);
for(let i=0;i<40;i++)P.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.5+.4,v:Math.random()*.25+.05});
(function f(){x.clearRect(0,0,w,h);if(!document.body.classList.contains('na')){x.fillStyle='#4f8bff55';P.forEach(p=>{p.y-=p.v;if(p.y<0){p.y=h;p.x=Math.random()*w}x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()})}requestAnimationFrame(f)})()})();
render(1);
pull(1);setInterval(()=>{if(!admin)pull()},60000);
</script></body></html>
